[package]
name = "web-dioxus"
version = "0.1.0"
authors = ["Stuart Harris <stuart.harris@red-badger.com>", "Nils Loewen <nils@nilsloewen.com>"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
anyhow.workspace = true
console_error_panic_hook = "0.1.7"
crux_kv.workspace = true
dioxus = { version = "0.7.2", features = ["router"] }
dioxus-logger = "0.7.2"
dioxus-sdk-geolocation = { git = "https://github.com/nilswloewen/dioxus-sdk.git", branch = "issue_101" }
dioxus-sdk-storage = { git = "https://github.com/nilswloewen/dioxus-sdk.git", branch = "issue_101" }
futures-util = "0.3.31"
getrandom = { version = "0.3", features = ["wasm_js"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde_json = "1.0.148"
shared = { path = "../shared" }
tracing = "0.1.43"
wasm-bindgen = "0.2.106"
wasm-bindgen-futures = "0.4.56"
wasm-streams = "0.4.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
dioxus = { version = "0.7.2", features = ["router", "web"] }
js-sys = "0.3.83"

[target.'cfg(target_os = "android")'.dependencies]
dioxus = { version = "0.7.2", features = ["router", "mobile"] }
jni = "0.21.1"
